# theme.css is generated from src/ and committed, because Obsidian loads one
# stylesheet and that is the one it loads. A generated file in the repository
# is only trustworthy if something notices when it stops matching its source,
# so this rebuilds it and fails if the result differs by a byte.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild theme.css
        run: node build.mjs

      - name: The committed theme.css is the one src/ builds
        run: |
          if ! git diff --quiet -- theme.css; then
            echo "::error file=theme.css::theme.css is out of date. Run 'node build.mjs' and commit the result."
            git diff --stat -- theme.css
            exit 1
          fi

      - name: The version stamp matches the manifest
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          stamped=$(grep -o -- '--bc-version: "[^"]*"' src/01-tokens.css | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "manifest.json $manifest / --bc-version $stamped"
          [ "$manifest" = "$stamped" ] || {
            echo "::error file=src/01-tokens.css::--bc-version is $stamped, manifest.json says $manifest"
            exit 1
          }

  stylesheet:
    # The engine's own opinion of the stylesheet: every rule keeps at least
    # one declaration, and every declaration is one it accepts. Separate from
    # the build job because it pays for a browser to find out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - run: node build.mjs

      - name: Check the built stylesheet
        working-directory: preview
        run: node check.mjs ../theme.css
