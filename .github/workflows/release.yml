# Obsidian installs a theme from theme.css and manifest.json, and looks the
# version up by the tag — so the tag is the version, with no "v" in front of
# it, and the manifest has to agree with it before anything is attached.
#
# The release is left as a draft. Publishing is a decision, not a side effect
# of pushing a tag.

name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The tag is the manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest=$(node -p "require('./manifest.json').version")
          echo "tag $tag / manifest.json $manifest"
          [ "$tag" = "$manifest" ] || {
            echo "::error file=manifest.json::tag $tag does not match manifest.json $manifest"
            exit 1
          }

      - name: Rebuild theme.css and check it against the tag
        run: |
          node build.mjs
          if ! git diff --quiet -- theme.css; then
            echo "::error file=theme.css::theme.css at this tag is not what src/ builds."
            exit 1
          fi

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --draft \
            --generate-notes \
            theme.css manifest.json
